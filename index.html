<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Quiz Builder - DOCX to QTI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Canvas Quiz Builder</h1>
            <p>Convert Word documents to Canvas QTI format</p>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px;">
                <a href="sample-quiz.docx" download class="sample-link">
                    📥 Download Sample Quiz
                </a>
                <a href="verify-qti.html" class="sample-link">
                    🔍 Verify QTI Package
                </a>
                <a href="generate-test-qti.html" class="sample-link">
                    📦 Download Test Package
                </a>
            </div>
        </header>

        <main>
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="drop-zone-text">Drag and drop your .docx file here</p>
                    <p class="drop-zone-subtext">or click to browse</p>
                    <input type="file" id="fileInput" accept=".docx" hidden>
                </div>
            </div>

            <div id="status" class="status-message"></div>

            <div id="results" class="results-section" style="display: none;">
                <div class="result-card">
                    <h3>Extracted Questions</h3>
                    <div id="questionCount" class="count-badge"></div>
                    <button id="viewJsonBtn" class="btn btn-secondary">View JSON</button>
                </div>

                <div class="result-card">
                    <h3>QTI Export</h3>
                    <div style="margin-bottom: 15px;">
                        <label for="qtiVersion" style="display: block; margin-bottom: 5px; font-weight: 500;">QTI Version:</label>
                        <select id="qtiVersion" style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 0.95rem;">
                            <option value="1.2">QTI 1.2 (Canvas, Moodle)</option>
                            <option value="2.1" selected>QTI 2.1 (Blackboard)</option>
                        </select>
                    </div>
                    <button id="downloadQtiBtn" class="btn btn-primary">Download QTI File</button>
                </div>
            </div>

            <div id="jsonModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close">&times;</span>
                    <h2>Extracted JSON</h2>
                    <pre id="jsonDisplay"></pre>
                    <button id="copyJsonBtn" class="btn btn-secondary">Copy to Clipboard</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="docx-parser.js"></script>
    <script src="qti-exporter.js"></script>
    <script src="app.js"></script>
</body>
</html>
